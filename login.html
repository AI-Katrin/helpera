<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Helpera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/login.css">
  <link rel="stylesheet" href="./css/base.css">
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">H</div>
      <span>Helpera</span>
    </a>
  </header>

  <main>
    <section class="login-card">
      <h1>Вход в систему</h1>
      <p class="subtitle">
        Войдите в личный кабинет волонтёра или НКО, чтобы продолжить работу с задачами.
      </p>

      <form id="loginForm">
        <div class="role-switch">
          <label class="role-option">
            <input type="radio" name="role" value="volunteer" checked />
            <span>Волонтёр</span>
          </label>

          <label class="role-option">
            <input type="radio" name="role" value="ngo" />
            <span>НКО</span>
          </label>
        </div>

        <div class="form-group">
          <label for="login">Email</label>
          <input
            type="text"
            id="login"
            name="login"
            placeholder="example@mail.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
              required
            />
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Показать пароль" aria-pressed="false"></button>
          </div>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="remember" />
            Запомнить меня
          </label>

          <a href="forgot-password.html" class="forgot">Забыли пароль?</a>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Войти
        </button>

        <div id="message" class="message"></div>
      </form>

      <div class="register">
        Нет аккаунта?
        <a href="register.html">Зарегистрироваться</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app-db.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");

    passwordToggle.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      passwordToggle.classList.toggle("is-visible", isHidden);
      passwordToggle.setAttribute("aria-label", isHidden ? "Скрыть пароль" : "Показать пароль");
      passwordToggle.setAttribute("aria-pressed", String(isHidden));
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const login = document.getElementById("login").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;
      message.className = "message";
      message.textContent = "";

      if (!login || !password) {
        showMessage("error", "Введите email и пароль.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(login)) {
        showMessage("error", "Для входа через Supabase Auth используйте email.");
        return;
      }

      button.disabled = true;
      button.textContent = "Выполняется вход...";

      try {
        await helperaDb.signInWithEmail({ email: login, password });
        const profile = await helperaDb.getCurrentUserProfile(role);

        if (!profile) {
          throw new Error(role === "volunteer"
            ? "Профиль волонтёра для этого аккаунта не найден."
            : "Профиль НКО для этого аккаунта не найден.");
        }

        if (role === "volunteer") {
          localStorage.setItem(helperaDb.localKeys.activeVolunteerProfileId, profile.profileId);
        } else {
          localStorage.setItem(helperaDb.localKeys.activeNgoProfileId, profile.profileId);
        }

        showMessage("success", "Вход выполнен успешно.");

        if (role === "volunteer") {
          window.location.href = `volunteer-lk.html?profileId=${encodeURIComponent(profile.profileId)}`;
        } else {
          window.location.href = `ngo-lk.html?profileId=${encodeURIComponent(profile.profileId)}`;
        }

      } catch (error) {
        showMessage("error", error.message || "Неверный email или пароль.");
      } finally {
        button.disabled = false;
        button.textContent = "Войти";
      }
    });

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }
  </script>
</body>
</html>
