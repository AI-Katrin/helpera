<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Helpera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/login.css">
  <link rel="stylesheet" href="./css/base.css">
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">H</div>
      
    </a>
  </header>

  <main>
    <section class="login-card">
      <h1>Вход в систему</h1>
      <p class="subtitle">
        Войдите в личный кабинет волонтёра или НКО, чтобы продолжить работу с задачами.
      </p>

      <form id="loginForm">
        <div class="role-switch">
          <label class="role-option">
            <input type="radio" name="role" value="volunteer" checked />
            <span>Волонтёр</span>
          </label>

          <label class="role-option">
            <input type="radio" name="role" value="ngo" />
            <span>НКО</span>
          </label>
        </div>

        <div class="social-row">
          <div id="yandex-widget-container"></div>
          <div id="vk-widget-container"></div>
        </div>
        <div class="divider"><span>или</span></div>

        <div class="form-group">
          <label for="login">Email</label>
          <input
            type="text"
            id="login"
            name="login"
            placeholder="example@mail.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
              required
            />
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Показать пароль" aria-pressed="false"></button>
          </div>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="remember" />
            Запомнить меня
          </label>

          <a href="forgot-password.html" class="forgot">Забыли пароль?</a>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Войти
        </button>

        <div id="message" class="message"></div>
      </form>

      <div class="register">
        Нет аккаунта?
        <a href="register.html">Зарегистрироваться</a>
      </div>
    </section>
  </main>

  <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
  <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app-db.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");

    // Яндекс — фирменная кнопка через YaAuthSuggest
    function initYandexButton() {
      const role = document.querySelector('input[name="role"]:checked')?.value || 'volunteer';
      const container = document.getElementById('yandex-widget-container');
      container.innerHTML = '';
      if (typeof YaAuthSuggest !== 'undefined') {
        YaAuthSuggest.init(
          { client_id: 'd03b76c5a057430eb4216ac2246b7347', response_type: 'token' },
          'yandex-widget-container',
          { view: 'button', parentOrigin: 'https://helpera.ru', buttonSize: 'm', buttonView: 'main', buttonTheme: 'light', buttonBorderRadius: 16, buttonIcon: 'yaicon' }
        )
        .then(({ handler }) => handler())
        .then(function (data) {
          return fetch('/api/auth/yandex-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: data.access_token, role }),
          });
        })
        .then(function (r) { return r.json(); })
        .then(function (result) {
          if (result.redirect) window.location.href = result.redirect;
          else showMessage('error', result.error || 'Не удалось войти через Яндекс');
        })
        .catch(function () { window.location.href = `/auth/yandex/start?role=${role}`; });
      } else {
        container.innerHTML = `<a class="social-btn" href="/auth/yandex/start?role=${role}" style="display:flex;align-items:center;gap:10px;height:52px;border:1px solid #D1D5DB;border-radius:16px;background:#fff;padding:0 14px;font-size:13px;font-weight:700;color:#111827;text-decoration:none;"><span style="width:24px;height:24px;border-radius:50%;background:#FCE7D6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#FC3F1D;flex-shrink:0;">Я</span>Войти через Яндекс</a>`;
      }
    }
    initYandexButton();
    document.querySelectorAll('input[name="role"]').forEach(function (radio) {
      radio.addEventListener("change", initYandexButton);
    });

    // ВКонтакте — виджет VK ID
    if ('VKIDSDK' in window) {
      const VKID = window.VKIDSDK;
      VKID.Config.init({
        app: 54612071,
        redirectUrl: 'https://helpera.ru/',
        responseMode: VKID.ConfigResponseMode.Callback,
        source: VKID.ConfigSource.LOWCODE,
        scope: 'email',
      });
      const oneTap = new VKID.OneTap();
      oneTap.render({
        container: document.getElementById('vk-widget-container'),
        showAlternativeLogin: false
      })
      .on(VKID.WidgetEvents.ERROR, function (error) {
        console.error('VK ID error', error);
      })
      .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
        const role = document.querySelector('input[name="role"]:checked')?.value || 'volunteer';
        VKID.Auth.exchangeCode(payload.code, payload.device_id)
          .then(function (data) {
            return fetch('/api/auth/vk-token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ access_token: data.access_token, email: data.email || null, role }),
            });
          })
          .then(function (r) { return r.json(); })
          .then(function (result) {
            if (result.redirect) window.location.href = result.redirect;
            else showMessage('error', result.error || 'Не удалось войти через ВКонтакте');
          })
          .catch(function () { showMessage('error', 'Не удалось подключиться. Попробуйте ещё раз.'); });
      });
    }

    passwordToggle.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      passwordToggle.classList.toggle("is-visible", isHidden);
      passwordToggle.setAttribute("aria-label", isHidden ? "Скрыть пароль" : "Показать пароль");
      passwordToggle.setAttribute("aria-pressed", String(isHidden));
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const login = document.getElementById("login").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;
      message.className = "message";
      message.textContent = "";

      if (!login || !password) {
        showMessage("error", "Введите email и пароль.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(login)) {
        showMessage("error", "Введите корректный email для входа.");
        return;
      }

      button.disabled = true;
      button.textContent = "Выполняется вход...";

      try {
        await helperaDb.signInWithEmail({ email: login, password });
        const profile = await helperaDb.getCurrentUserProfile(role);

        if (!profile) {
          throw new Error(role === "volunteer"
            ? "Профиль волонтёра для этого аккаунта не найден."
            : "Профиль НКО для этого аккаунта не найден.");
        }

        if (role === "volunteer") {
          localStorage.setItem(helperaDb.localKeys.activeVolunteerProfileId, profile.profileId);
        } else {
          localStorage.setItem(helperaDb.localKeys.activeNgoProfileId, profile.profileId);
        }
        localStorage.setItem('helpera_login_ts', String(Date.now()));

        showMessage("success", "Вход выполнен успешно.");

        if (role === "volunteer") {
          window.location.href = `volunteer-lk.html?profileId=${encodeURIComponent(profile.profileId)}`;
        } else {
          window.location.href = `ngo-lk.html?profileId=${encodeURIComponent(profile.profileId)}`;
        }

      } catch (error) {
        let msg = "Неверный email или пароль.";
        if (error && error.message) {
          const m = error.message.toLowerCase();
          if (m.includes("invalid login credentials") || m.includes("invalid_credentials") || m.includes("invalid email or password")) {
            msg = "Неправильный логин или пароль.";
          } else if (m.includes("failed to fetch") || m.includes("networkerror") || m.includes("network request failed") || m.includes("fetch")) {
            msg = "Не удалось подключиться к серверу. Проверьте интернет-соединение и попробуйте ещё раз.";
          } else if (m.includes("email not confirmed")) {
            msg = "Email не подтверждён. Проверьте почту и перейдите по ссылке из письма.";
          } else if (m.includes("too many requests")) {
            msg = "Слишком много попыток входа. Подождите несколько минут и попробуйте снова.";
          } else if (m.includes("профиль") || m.includes("profile")) {
            msg = error.message;
          }
        }
        showMessage("error", msg);
      } finally {
        button.disabled = false;
        button.textContent = "Войти";
      }
    });

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }
  </script>
</body>
</html>
