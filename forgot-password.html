<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Восстановление пароля — Helpera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/login.css">
  <link rel="stylesheet" href="./css/base.css">
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
    </a>
  </header>

  <main>
    <section class="login-card">
      <div class="login-header">
        <h1 class="login-title">Восстановление пароля</h1>
        <p class="login-subtitle">Введите email — мы пришлём ссылку для создания нового пароля</p>
      </div>

      <form id="resetForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@mail.com"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit" class="login-button" id="resetButton">Отправить письмо</button>

        <div id="message" class="message"></div>
      </form>

      <div class="register" style="margin-top: 20px;">
        <a href="login.html">← Вернуться ко входу</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app-db.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('resetButton');

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) return;

      button.disabled = true;
      button.textContent = 'Отправляем...';

      try {
        if (!helperaDb.client) {
          throw new Error('Сервис временно недоступен. Попробуйте позже.');
        }
        const { error } = await helperaDb.client.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://helpera.ru/reset-password.html',
        });
        if (error) throw error;

        form.style.display = 'none';
        showMessage('success',
          `Письмо отправлено на ${email}. Проверьте почту и перейдите по ссылке в письме.`
        );
      } catch (err) {
        const m = (err?.message || '').toLowerCase();
        if (m.includes('failed to fetch') || m.includes('network')) {
          showMessage('error', 'Не удалось подключиться. Проверьте интернет и попробуйте снова.');
        } else {
          showMessage('error', 'Не удалось отправить письмо. Попробуйте ещё раз.');
        }
        button.disabled = false;
        button.textContent = 'Отправить письмо';
      }
    });
  </script>
</body>
</html>
