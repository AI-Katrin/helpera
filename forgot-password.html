<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Восстановление пароля — Helpera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/login.css">
  <link rel="stylesheet" href="./css/base.css">
  <style>
    input[type="email"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #D1D5DB;
      border-radius: 16px;
      font-size: 16px;
      color: #111827;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    input[type="email"]:focus {
      border-color: #2E7D32;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.12);
    }
    input[type="email"]::placeholder {
      color: #9CA3AF;
    }

    .fp-icon {
      width: 56px;
      height: 56px;
      background: #E8F5E9;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .fp-icon svg {
      width: 26px;
      height: 26px;
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 10px;
      text-align: center;
    }
    .login-subtitle {
      font-size: 15px;
      line-height: 1.55;
      color: #6B7280;
      margin-bottom: 28px;
      text-align: center;
    }

    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      background: #D1FAE5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .success-icon svg {
      width: 26px;
      height: 26px;
    }
    .success-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    .success-text {
      font-size: 14px;
      line-height: 1.6;
      color: #6B7280;
      margin-bottom: 24px;
    }
    .success-email {
      font-weight: 700;
      color: #111827;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
    </a>
  </header>

  <main>
    <section class="login-card">

      <div id="formState">
        <div class="fp-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
        </div>

        <h1 class="login-title">Восстановление пароля</h1>
        <p class="login-subtitle">Введите email — мы пришлём ссылку для создания нового пароля</p>

        <form id="resetForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@mail.com"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="login-button" id="resetButton">Отправить письмо</button>

          <div id="errorMsg" class="message"></div>
        </form>
      </div>

      <div id="successState" class="success-state">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20,6 9,17 4,12"/>
          </svg>
        </div>
        <p class="success-title">Письмо отправлено</p>
        <p class="success-text">
          Проверьте почту <span class="success-email" id="sentEmail"></span> и перейдите по ссылке в письме.
          Если не видите письмо — загляните в папку «Спам».
        </p>
        <a href="login.html" class="login-button" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Вернуться ко входу</a>
      </div>

      <div class="register" style="margin-top: 20px;" id="backLink">
        <a href="login.html">← Вернуться ко входу</a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app-db.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const errorMsg = document.getElementById('errorMsg');
    const button = document.getElementById('resetButton');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) return;

      errorMsg.className = 'message';
      button.disabled = true;
      button.textContent = 'Отправляем…';

      try {
        if (!helperaDb.client) {
          throw new Error('Сервис временно недоступен. Попробуйте позже.');
        }
        const { error } = await helperaDb.client.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://helpera.ru/reset-password.html',
        });
        if (error) throw error;

        document.getElementById('sentEmail').textContent = email;
        document.getElementById('formState').style.display = 'none';
        document.getElementById('backLink').style.display = 'none';
        document.getElementById('successState').style.display = 'flex';
      } catch (err) {
        const m = (err?.message || '').toLowerCase();
        errorMsg.className = 'message error';
        errorMsg.textContent = (m.includes('failed to fetch') || m.includes('network'))
          ? 'Не удалось подключиться. Проверьте интернет и попробуйте снова.'
          : 'Не удалось отправить письмо. Попробуйте ещё раз.';
        button.disabled = false;
        button.textContent = 'Отправить письмо';
      }
    });
  </script>
</body>
</html>
