  /api/ngos/{ngo_id}:
    get:
      tags: [NGOs]
      summary: Получить публичный профиль НКО
      description: Возвращает только публичные поля (контактные данные не раскрываются).
      operationId: getNgo
      parameters:
        - $ref: "#/components/parameters/NgoId"
      responses:
