        - $ref: "#/components/parameters/NgoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NgoInput"
      responses:
        "200":
          description: Обновлённый профиль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NgoProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/ngos/{ngo_id}/refresh-reliability:
    post:
      tags: [NGOs]
      summary: Пересчитать надёжность НКО
      description: Пересчитывает avg_response_time_hours и ngo_reliability_score по истории откликов и сохраняет в профиль НКО.
      operationId: refreshNgoReliability
      parameters:
        - $ref: "#/components/parameters/NgoId"
      responses:
        "200":
          description: Результат пересчёта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilityNgoResponse"
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── Tasks ──────────────────────────────────────────────────────────────────

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Список опубликованных задач
      description: Возвращает задачи со статусом published, отсортированные по дате создания (новые первые). Включает публичный профиль НКО.
      operationId: listTasks
      responses:
        "200":
          description: Массив задач с встроенным профилем НКО.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"
    post:
      tags: [Tasks]
      summary: Создать задачу
      description: |
        Валидация: title ≥5 символов, description ≥30, skills и format обязательны,
        обе даты обязательны, directions обязательны, city обязателен для офлайн/смешанного.
        Лимит: не более 10 активных задач на НКО.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Созданная задача.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Ошибка валидации или превышен лимит задач НКО.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/tasks/check-duplicate:
    post:
      tags: [Tasks]
      summary: Проверить задачу на дубликат
      description: Сравнивает задачу с существующими через TF-IDF и возвращает оценку сходства. Задачи самой НКО исключаются.
      operationId: checkTaskDuplicate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDuplicateCheckRequest"
      responses:
        "200":
          description: Результат проверки на дубликат.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDuplicateCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/tasks/{task_id}:
    get:
      tags: [Tasks]
      summary: Получить задачу по id
      description: Возвращает задачу с встроенным публичным профилем НКО (org_name, about).
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Задача с встроенным профилем НКО.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"
    patch:
      tags: [Tasks]
      summary: Обновить задачу
      description: Только представитель НКО-владельца задачи.
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Обновлённая задача.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/tasks/expire:
    post:
      tags: [Internal]
      summary: Вручную снять задачи с истёкшим дедлайном
      description: Только localhost. В проде запускается фоновым потоком каждые N секунд.
      operationId: expireTasks
      responses:
        "200":
          description: Результат снятия задач.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpireTasksResponse"
        "403":
          description: Доступ разрешён только с localhost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── Applications ───────────────────────────────────────────────────────────

  /api/applications:
    post:
      tags: [Applications]
      summary: Создать заявку (волонтёр откликается на задачу)
      description: |
        Проверяет право на отклик: статус задачи, дедлайн, заполненность, дубликат заявки.
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Созданная заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Не выполнены условия для отклика (дубликат, задача закрыта и т.д.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/process-timeouts:
    post:
      tags: [Internal]
      summary: Перевести зависшие заявки в статус timeout
      description: Только localhost. Заявки в статусе review старше N дней → timeout.
      operationId: processApplicationTimeouts
      responses:
        "200":
          description: Результат обработки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessTimeoutsResponse"
        "403":
          description: Доступ разрешён только с localhost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}:
    get:
      tags: [Applications]
      summary: Получить заявку по id
      description: Возвращает только статусные поля (payload с отзывами не раскрывается).
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Публичные поля заявки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"
    patch:
      tags: [Applications]
      summary: Обновить поля заявки
      description: Только участники заявки (волонтёр или НКО-владелец задачи).
      operationId: updateApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}/accept:
    post:
      tags: [Applications]
      summary: Принять заявку (status → invite)
      description: Только представитель НКО-владельца задачи.
      operationId: acceptApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}/reject:
    post:
      tags: [Applications]
      summary: Отклонить заявку (status → rejected)
      description: Только представитель НКО-владельца задачи.
      operationId: rejectApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}/complete:
    post:
      tags: [Applications]
      summary: Завершить заявку (status → done)
      description: Только представитель НКО-владельца задачи.
      operationId: completeApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}/partial:
    post:
      tags: [Applications]
      summary: Закрыть заявку с частичным выполнением (status → partial_done)
      description: |
        Только представитель НКО-владельца задачи.
        Засчитывается как 0.5 в шкале надёжности волонтёра.
      operationId: partialCompleteApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/applications/{application_id}/cancel:
    post:
      tags: [Applications]
      summary: Отменить заявку волонтёром (status → cancelled_by_volunteer)
      description: |
        Только владелец волонтёрского профиля заявки.
        Допустимые статусы для отмены: review, invite, active, timeout.
        Поздняя отмена (после invite/active) помечается как lateCancellation.
      operationId: cancelApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Необязательная причина отмены.
      responses:
        "200":
          description: Обновлённая заявка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Нельзя отменить заявку в текущем статусе.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── Reviews ────────────────────────────────────────────────────────────────

  /api/reviews:
    post:
      tags: [Reviews]
      summary: Оставить отзыв по завершённой заявке
      description: |
        Отзывы хранятся в applications.payload.reviews[actor_role].
        Повторный отзыв от той же стороны запрещён.
        Задача переходит в статус done только при двустороннем отзыве.
        Валидация: ratings ≥3 оценок (1–10), shortReview ≥50 символов и ≥5 слов.
      operationId: createReview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Обновлённая заявка с сохранённым отзывом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationWithReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Отзыв от этой стороны уже оставлен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── Events ─────────────────────────────────────────────────────────────────

  /api/events:
    post:
      tags: [Events]
      summary: Записать событие заявки
      description: Вставляет запись в таблицу app_events для аналитики и дообучения ML-модели.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Созданная запись события.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── Recommendations ────────────────────────────────────────────────────────

  /api/recommendations/volunteers/{volunteer_id}:
    get:
      tags: [Recommendations]
      summary: ML-рекомендации задач для волонтёра
      description: Возвращает ранжированный список задач на основе TF-IDF + LinUCB. При нехватке данных активируется fallback-режим.
      operationId: getVolunteerRecommendations
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
        - name: k
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
          description: Количество рекомендаций.
        - name: hidden
          in: query
          required: false
          schema:
            type: string
          description: Задачи через запятую для исключения из выдачи.
      responses:
        "200":
          description: Ответ рекомендательной системы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: Артефакт модели недоступен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recommendations/events:
    post:
      tags: [Recommendations]
      summary: Записать событие взаимодействия с рекомендацией
      description: Фиксирует click/skip/apply для дообучения LinUCB. Событие попадает в кольцевой буфер event_logger.
      operationId: recordRecommendationEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationEventRequest"
      responses:
        "200":
          description: Событие принято.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/recommendations/events/stats:
    get:
      tags: [Recommendations]
      summary: Статистика лога событий рекомендательной системы
      description: Показывает число событий по типам, размер файла и утилизацию буфера event_logger.
      operationId: getRecommendationEventStats
      responses:
        "200":
          description: Статистика по типам событий и состоянию буфера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStatsResponse"
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── AI ─────────────────────────────────────────────────────────────────────

  /api/ai/task:
    post:
      tags: [AI]
      summary: Сгенерировать или улучшить описание задачи через Яндекс AI
      description: Использует YandexGPT для генерации (action=draft) или улучшения (action=transform) текста описания задачи НКО.
      operationId: generateTaskText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AITaskRequest"
      responses:
        "200":
          description: Сгенерированный текст.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AITaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Тело запроса слишком большое.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: YANDEX_CLOUD_API_KEY или YANDEX_CLOUD_FOLDER не настроены.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Яндекс AI вернул пустой ответ или недоступен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
