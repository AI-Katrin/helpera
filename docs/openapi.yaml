openapi: 3.0.3
info:
  title: Helpera API
  version: 1.2.0
  description: REST API платформы Helpera — распределение волонтёрских ресурсов для задач НКО.
  contact:
    name: Helpera
    url: https://github.com/AI-Katrin/helpera
servers:
  - url: https://helpera.ru
    description: Production (reg.ru)

tags:
  - name: Health
  - name: Volunteers
  - name: NGOs
  - name: Tasks
  - name: Applications
  - name: Reviews
  - name: Events
  - name: Recommendations
  - name: AI
  - name: OAuth
  - name: Internal
    description: Только localhost. Используются для admin-панели и фоновых задач.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access_token из сессии пользователя.

  parameters:
    VolunteerId:
      name: volunteer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NgoId:
      name: ngo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Role:
      name: role
      in: query
      required: false
      schema:
        type: string
        default: volunteer
        enum: [volunteer, ngo]
      description: Роль пользователя для сохранения через OAuth flow.
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
    OAuthState:
      name: state
      in: query
      required: false
      schema:
        type: string
    OAuthError:
      name: error
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Тело запроса не является валидным JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Требуется авторизация или токен недействителен.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Нет прав на выполнение операции (IDOR-защита).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Обязательные поля отсутствуют или невалидны.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SupabaseUnavailable:
      description: Supabase не настроен или недоступен.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Машиночитаемый код ошибки.
        errors:
          type: array
          items:
            type: string
          description: Список ошибок валидации (при наличии нескольких).

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # --- Volunteers ---

    VolunteerInput:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        contact:
          type: string
          example: anna@example.ru
        registration_step:
          type: string
          example: completed
        account:
          type: object
          additionalProperties: true
          example:
            firstName: Анна
            lastName: Иванова
            city: Москва
        about:
          type: object
          additionalProperties: true
          example:
            bio: Помогаю животным уже 3 года
            motivation: Хочу делать мир лучше
        skills:
          type: object
          additionalProperties: true
          example:
            helpSkills: [Фотография, SMM]
            languages: [Русский, Английский]
        interests:
          type: object
          additionalProperties: true
          example:
            tasks: [Животные, Экология]
            formats: [Онлайн]
        notifications:
          type: object
          additionalProperties: true
          example:
            email: true
            push: false

    VolunteerProfile:
      allOf:
        - $ref: "#/components/schemas/VolunteerInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time

    VolunteerPublicProfile:
      description: Публичные поля профиля волонтёра (PII не раскрываются).
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        skills_clean:
          type: array
          items:
            type: string
          nullable: true
        directions_clean:
          type: array
          items:
            type: string
          nullable: true
        city_clean:
          type: string
          nullable: true
        format_clean:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        profile_completeness:
          type: number
          format: float
          nullable: true
        volunteer_reliability_score:
          type: number
          format: float
          nullable: true
        active_tasks_count:
          type: integer
          nullable: true

    # --- NGOs ---

    NgoInput:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        org_name:
          type: string
          example: Фонд помощи детям
        contact:
          type: string
          example: info@fond.ru
        registration_step:
          type: string
          example: completed
        account:
          type: object
          additionalProperties: true
          example:
            orgName: Фонд помощи детям
            city: Санкт-Петербург
        about:
          type: object
          additionalProperties: true
          example:
            mission: Помогаем детям в трудной жизненной ситуации
            founded: "2010"
        contacts:
          type: object
          additionalProperties: true
          example:
            website: https://fond.ru
            vk: https://vk.com/fond
        first_task:
          type: object
          additionalProperties: true
          example:
            title: Помощь с мероприятием
            format: Оффлайн

    NgoProfile:
      allOf:
        - $ref: "#/components/schemas/NgoInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time

    NgoPublicProfile:
      description: Публичные поля профиля НКО (PII и контакты не раскрываются).
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        org_name:
          type: string
          nullable: true
        about:
          type: object
          additionalProperties: true
          nullable: true
        ngo_reliability_score:
          type: number
          format: float
          nullable: true
        complaint_rate:
          type: number
          format: float
          nullable: true
        avg_response_time_hours:
          type: number
          format: float
          nullable: true

    # --- Tasks ---

    TaskInput:
      type: object
      properties:
        ngo_profile_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 30
        format:
          type: string
          example: Онлайн
        skills:
          type: string
        date_start:
          type: string
          format: date
          nullable: true
        date_end:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [published, closed, draft, active]
          default: published
        payload:
          type: object
          additionalProperties: true
          example:
            directions: Экология
            city: Москва
            volunteers_needed: 3

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            ngo_profiles:
              type: object
              nullable: true
              description: Встроенный профиль НКО (org_name, about).
              additionalProperties: true
              example:
                org_name: Фонд помощи детям
                about:
                  mission: Помогаем детям в трудной жизненной ситуации

    # --- Applications ---

    ApplicationInput:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        volunteer_profile_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - review
            - invite
            - rejected
            - done
            - partial_done
            - timeout
            - cancelled_by_volunteer
            - expired
            - active
          default: review
        payload:
          type: object
          additionalProperties: true
          example:
            cover_letter: Хочу помочь, у меня есть опыт в фотографии

    Application:
      allOf:
        - $ref: "#/components/schemas/ApplicationInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
              nullable: true

    ApplicationPublic:
      description: Статусные поля заявки без раскрытия payload с отзывами.
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        volunteer_profile_id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    ApplicationWithReview:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            both_reviewed:
              type: boolean
              description: true если оба участника (волонтёр и НКО) уже оставили отзыв.

    ApplicationCancelResponse:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            reliability_refreshed:
              type: boolean
              description: true если надёжность волонтёра была пересчитана.

    # --- Reviews ---

    ReviewInput:
      type: object
      required: [application_id]
      properties:
        application_id:
          type: string
          format: uuid
        actor_role:
          type: string
          enum: [volunteer, ngo]
          default: volunteer
        review:
          type: object
          description: |
            Данные отзыва. Обязательно: ratings (объект с ≥3 оценками 1–10),
            shortReview (≥50 символов, ≥5 слов).
            Необязательно: extendedReview (≥200 символов, ≥15 слов),
            completion (для НКО: completed | partial | not_completed).
          properties:
            ratings:
              type: object
              additionalProperties:
                type: number
              example:
                communication: 8
                responsibility: 9
                quality: 7
            shortReview:
              type: string
              minLength: 50
              example: Волонтёр отработал отлично, пришёл вовремя и выполнил все задачи.
            extendedReview:
              type: string
              minLength: 200
              nullable: true
            completion:
              type: string
              enum: [completed, partial, not_completed]
              description: Только для actor_role=ngo.

    # --- Events ---

    EventInput:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
        actor_role:
          type: string
          nullable: true
        actor_profile_id:
          type: string
          format: uuid
          nullable: true
        application_id:
          type: string
          format: uuid
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        payload:
          type: object
          additionalProperties: true
          example:
            source: recommendation_feed
            previous_status: invite

    AppEvent:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time

    # --- Recommendations ---

    RecommendationHealth:
      type: object
      required: [status, model_loaded, model_name, variant_name, schema_version, feature_count, artifact_path]
      properties:
        status:
          type: string
          enum: [ok, error]
        model_loaded:
          type: boolean
        model_name:
          type: string
        variant_name:
          type: string
        schema_version:
          type: string
        feature_count:
          type: integer
        artifact_path:
          type: string
        error:
          type: string

    RecommendationResponse:
      type: object
      required: [volunteer_id, k, model_name, variant_name, schema_version, recommendation_session_id, items]
      properties:
        volunteer_id:
          type: string
        k:
          type: integer
        model_name:
          type: string
        variant_name:
          type: string
        schema_version:
          type: string
        recommendation_session_id:
          type: string
          format: uuid
        fallback_mode:
          type: string
          nullable: true
          enum: [relaxed_diversity, no_tasks]
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedTask"

    RecommendedTask:
      type: object
      required:
        - rank
        - task_id
        - ngo_id
        - title
        - about_task
        - work_to_do
        - useful_skills
        - direction_work
        - region
        - date_start
        - date_end
        - participation_type
        - ngo_name
        - ml_score
        - linucb_bonus
        - business_adjustment
        - final_score
        - match_percent
        - reason
        - payload
      properties:
        rank:
          type: integer
        task_id:
          type: string
        ngo_id:
          type: string
        title:
          type: string
        about_task:
          type: string
        work_to_do:
          type: string
        useful_skills:
          type: string
        direction_work:
          type: string
        region:
          type: string
        date_start:
          type: string
        date_end:
          type: string
        participation_type:
          type: string
        ngo_name:
          type: string
        ml_score:
          type: number
          format: float
        linucb_bonus:
          type: number
          format: float
        business_adjustment:
          type: number
          format: float
        final_score:
          type: number
          format: float
        match_percent:
          type: integer
          minimum: 1
          maximum: 98
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true

    RecommendationEventRequest:
      type: object
      required: [event_type, task_id, volunteer_id]
      properties:
        event_type:
          type: string
          example: click
        task_id:
          type: string
        volunteer_id:
          type: string

    EventStatsResponse:
      type: object
      description: Статистика лога событий рекомендательной системы.
      additionalProperties: true
      example:
        click: 142
        apply: 31
        file_size_bytes: 48320
        buffer_utilization: 0.47

    # --- Tasks duplicate check ---

    TaskDuplicateCheckRequest:
      type: object
      required: [task]
      properties:
        task:
          $ref: "#/components/schemas/TaskInput"
        ngo_id:
          type: string
          description: Необязательно. Существующие задачи этой НКО исключаются из проверки.

    TaskDuplicateCheckResponse:
      type: object
      required: [is_duplicate, similarity, most_similar_task_id, most_similar_score]
      properties:
        is_duplicate:
          type: boolean
        similarity:
          type: number
          format: float
          minimum: 0
          maximum: 1
        most_similar_task_id:
          type: string
          nullable: true
        most_similar_score:
          type: number
          format: float
          minimum: 0
          maximum: 1

    # --- AI ---

    AITaskRequest:
      type: object
      properties:
        action:
          type: string
          enum: [draft, transform]
          default: transform
        task:
          $ref: "#/components/schemas/TaskInput"
        prompt:
          type: string
          maxLength: 500
        options:
          type: object
          properties:
            temperature:
              type: number
              minimum: 0
              maximum: 1
              default: 0.3
            maxOutputTokens:
              type: integer
              minimum: 150
              maximum: 900
              default: 500
            style:
              type: string
              maxLength: 300

    AITaskResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string

    # --- OAuth ---

    AuthTokenRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: Токен от VK ID SDK или Яндекс ID SDK.
        role:
          type: string
          enum: [volunteer, ngo]
          default: volunteer
        email:
          type: string
          description: Email из ответа exchangeCode VK (необязательно, только для vk-token).

    VkCodeRequest:
      type: object
      required: [code, device_id]
      properties:
        code:
          type: string
          description: Код авторизации от VK ID SDK.
        device_id:
          type: string
          description: device_id из VK ID SDK.
        role:
          type: string
          enum: [volunteer, ngo]
          default: volunteer

    AuthRedirectResponse:
      type: object
      required: [redirect]
      properties:
        redirect:
          type: string
          description: |
            URL для редиректа клиента. Формат:
            /auth-callback.html?role=...&is_new=0|1&user_id=...#access_token=...&refresh_token=...

    # --- Compute / Reliability ---

    WorkloadResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
        reason:
          type: string
          description: Причина если updated=false.
        active_tasks_count:
          type: integer
          nullable: true

    ReliabilityVolunteerResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
        reason:
          type: string
          nullable: true
        volunteer_cancel_rate:
          type: number
          format: float
          nullable: true
        volunteer_reliability_score:
          type: number
          format: float
          nullable: true
        volunteer_review_avg_rating:
          type: number
          format: float
          nullable: true

    ReliabilityNgoResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
        reason:
          type: string
          nullable: true
        avg_response_time_hours:
          type: number
          format: float
          nullable: true
        ngo_reliability_score:
          type: number
          format: float
          nullable: true

    # --- Internal ---

    ExpireTasksResponse:
      type: object
      required: [ok, expired, message]
      properties:
        ok:
          type: boolean
        expired:
          type: integer
        message:
          type: string

    ProcessTimeoutsResponse:
      type: object
      required: [processed, timed_out, timeout_days]
      properties:
        processed:
          type: integer
        timed_out:
          type: integer
        timeout_days:
          type: integer


paths:

  # ─── Health ────────────────────────────────────────────────────────────────

  /api/health:
    get:
      tags: [Health]
      summary: Общий health-check сервера
      description: Возвращает статус ok если сервер запущен и отвечает.
      operationId: getHealth
      responses:
        "200":
          description: Сервер работает.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/recommendations/health:
    get:
      tags: [Health, Recommendations]
      summary: Health-check ML-модели рекомендаций
      description: Возвращает статус загрузки артефакта модели, имя, версию схемы и число признаков.
      operationId: getRecommendationHealth
      responses:
        "200":
          description: Статус модели.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationHealth"

  # ─── OAuth (server-side flow) ───────────────────────────────────────────────

  /auth/vk/start:
    get:
      tags: [OAuth]
      summary: Начало VK OAuth flow (server-side redirect)
      description: Генерирует URL авторизации VK с HMAC-подписанным state и перенаправляет браузер.
      operationId: startVkOAuth
      parameters:
        - $ref: "#/components/parameters/Role"
      responses:
        "302":
          description: Редирект на страницу авторизации VK.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /auth/yandex/start:
    get:
      tags: [OAuth]
      summary: Начало Yandex OAuth flow (server-side redirect)
      description: Генерирует URL авторизации Яндекс с HMAC-подписанным state и перенаправляет браузер.
      operationId: startYandexOAuth
      parameters:
        - $ref: "#/components/parameters/Role"
      responses:
        "302":
          description: Редирект на страницу авторизации Яндекс.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /auth/vk/callback:
    get:
      tags: [OAuth]
      summary: Обработка callback от VK OAuth
      description: Обменивает code на токен VK, создаёт или находит пользователя в Supabase и перенаправляет на auth-callback.html.
      operationId: handleVkOAuthCallback
      parameters:
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "302":
          description: Редирект на auth-callback.html с токенами или ошибкой.
          headers:
            Location:
              schema:
                type: string

  /auth/yandex/callback:
    get:
      tags: [OAuth]
      summary: Обработка callback от Yandex OAuth
      description: Обменивает code на токен Яндекс, создаёт или находит пользователя в Supabase и перенаправляет на auth-callback.html.
      operationId: handleYandexOAuthCallback
      parameters:
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "302":
          description: Редирект на auth-callback.html с токенами или ошибкой.
          headers:
            Location:
              schema:
                type: string

  # ─── OAuth (client-side SDK flow) ──────────────────────────────────────────

  /api/auth/vk-token:
    post:
      tags: [OAuth]
      summary: Авторизация через VK ID SDK (access_token уже получен браузером)
      description: Клиентский flow. Браузер получил access_token через VKID.Auth.exchangeCode — сервер запрашивает данные пользователя и создаёт/находит аккаунт в Supabase.
      operationId: vkTokenAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: URL для редиректа клиента.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/vk-code:
    post:
      tags: [OAuth]
      summary: Серверный обмен VK ID code → токен (confidential client)
      description: Сервер сам обменивает code на access_token через VK ID API (confidential client, секрет не раскрывается клиенту).
      operationId: vkCodeAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VkCodeRequest"
      responses:
        "200":
          description: URL для редиректа клиента.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/yandex-token:
    post:
      tags: [OAuth]
      summary: Авторизация через Яндекс ID SDK (access_token уже получен браузером)
      description: Клиентский flow. Браузер получил access_token через Яндекс ID SDK — сервер запрашивает данные пользователя и создаёт/находит аккаунт в Supabase.
      operationId: yandexTokenAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: URL для редиректа клиента.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Volunteers ─────────────────────────────────────────────────────────────

  /api/volunteers:
    post:
      tags: [Volunteers]
      summary: Создать профиль волонтёра
      description: Создаёт запись в таблице volunteer_profiles. Вызывается после завершения онбординга.
      operationId: createVolunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "201":
          description: Созданный профиль волонтёра.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/volunteers/{volunteer_id}:
    get:
      tags: [Volunteers]
      summary: Получить публичный профиль волонтёра
      description: Возвращает только публичные поля (PII не раскрываются).
      operationId: getVolunteer
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      responses:
        "200":
          description: Публичный профиль волонтёра.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerPublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"
    patch:
      tags: [Volunteers]
      summary: Обновить профиль волонтёра
      description: Только владелец профиля.
      operationId: updateVolunteer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "200":
          description: Обновлённый профиль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/volunteers/{volunteer_id}/refresh-workload:
    post:
      tags: [Volunteers]
      summary: Пересчитать нагрузку волонтёра (активные задачи)
      description: Пересчитывает active_tasks_count по текущим заявкам и сохраняет в профиль волонтёра.
      operationId: refreshVolunteerWorkload
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      responses:
        "200":
          description: Результат пересчёта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadResponse"
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  /api/volunteers/{volunteer_id}/refresh-reliability:
    post:
      tags: [Volunteers]
      summary: Пересчитать надёжность волонтёра
      description: Пересчитывает volunteer_cancel_rate и volunteer_reliability_score по истории заявок и сохраняет в профиль.
      operationId: refreshVolunteerReliability
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      responses:
        "200":
          description: Результат пересчёта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilityVolunteerResponse"
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SupabaseUnavailable"

  # ─── NGOs ───────────────────────────────────────────────────────────────────

  /api/ngos:
    post:
      tags: [NGOs]
      summary: Создать профиль НКО
      description: Создаёт запись в таблице ngo_profiles. Вызывается после завершения онбординга НКО.
      operationId: createNgo
      requestBody:
        required: true
        content:
          application/json:
