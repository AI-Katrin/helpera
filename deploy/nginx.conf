server {
    listen 80;
    server_name helpera.ru www.helpera.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name helpera.ru www.helpera.ru;

    ssl_certificate     /etc/letsencrypt/live/helpera.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpera.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Логи
    access_log  /var/log/nginx/helpera.access.log;
    error_log   /var/log/nginx/helpera.error.log;

    # Максимальный размер тела запроса (для API)
    client_max_body_size 1M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options             "DENY" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src https://fonts.gstatic.com; "
        "img-src 'self' data: https:; "
        "connect-src 'self' https://*.supabase.co https://api.vk.com https://oauth.yandex.ru; "
        "frame-ancestors 'none';" always;

    # ── Блокировка чувствительных файлов ─────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|py|sh|sql|cfg|ini|log|md|txt|pyc)$ {
        deny all;
        return 404;
    }

    location ~ ^/(backend|deploy|model_artifacts)/ {
        deny all;
        return 404;
    }

    # ── Rate limiting на auth и API ───────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;

    # Admin-эндпоинты — только с localhost (фоновый поток)
    location ~ ^/api/(tasks/expire|applications/process-timeouts)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Основной прокси ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
