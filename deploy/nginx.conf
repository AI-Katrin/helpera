server {
    listen 80;
    server_name helpera.ru www.helpera.ru;

    # Редирект на HTTPS (активировать после получения сертификата)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name helpera.ru www.helpera.ru;

    ssl_certificate     /etc/letsencrypt/live/helpera.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpera.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Логи
    access_log  /var/log/nginx/helpera.access.log;
    error_log   /var/log/nginx/helpera.error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    # Проксируем всё на Python-сервер
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
