<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый пароль — Helpera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/login.css">
  <link rel="stylesheet" href="./css/base.css">
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
    </a>
  </header>

  <main>
    <section class="login-card">
      <div class="login-header">
        <h1 class="login-title">Новый пароль</h1>
        <p class="login-subtitle">Придумайте надёжный пароль</p>
      </div>

      <div id="errorState" style="display:none;">
        <div class="message error" id="errorMsg">Ссылка недействительна или устарела.</div>
        <a href="forgot-password.html" class="login-button" style="display:block;text-align:center;margin-top:16px;text-decoration:none;">Запросить новую ссылку</a>
      </div>

      <form id="resetForm" style="display:none;">
        <div class="form-group">
          <label for="password">Новый пароль</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="Минимум 8 символов" required />
            <button class="password-toggle" id="togglePassword" type="button" aria-label="Показать пароль"></button>
          </div>
        </div>

        <div class="form-group">
          <label for="password2">Повторите пароль</label>
          <input type="password" id="password2" placeholder="Повторите пароль" required />
        </div>

        <button type="submit" class="login-button" id="saveButton">Сохранить пароль</button>
        <div id="message" class="message"></div>
      </form>

      <div id="loadingState" style="text-align:center;padding:32px;color:#6B7280;">
        Проверяем ссылку…
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app-db.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('saveButton');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }

    document.getElementById('togglePassword').addEventListener('click', function () {
      const input = document.getElementById('password');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
    });

    async function init() {
      if (!helperaDb.client) {
        loadingState.style.display = 'none';
        errorState.style.display = 'block';
        return;
      }

      // Supabase передаёт токен в хэше URL: #access_token=...&type=recovery
      const hash = Object.fromEntries(new URLSearchParams(window.location.hash.slice(1)));
      const accessToken = hash.access_token;
      const refreshToken = hash.refresh_token;
      const type = hash.type;

      if (!accessToken || type !== 'recovery') {
        loadingState.style.display = 'none';
        errorState.style.display = 'block';
        return;
      }

      // Устанавливаем сессию по токену из письма
      const { error } = await helperaDb.client.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });

      if (error) {
        loadingState.style.display = 'none';
        document.getElementById('errorMsg').textContent = 'Ссылка устарела. Запросите новую.';
        errorState.style.display = 'block';
        return;
      }

      // Убираем токены из URL
      history.replaceState(null, '', window.location.pathname);
      loadingState.style.display = 'none';
      form.style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password.length < 8) {
        showMessage('error', 'Пароль должен быть не менее 8 символов.');
        return;
      }
      if (password !== password2) {
        showMessage('error', 'Пароли не совпадают.');
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = 'Сохраняем...';

      try {
        const { error } = await helperaDb.client.auth.updateUser({ password });
        if (error) throw error;

        form.style.display = 'none';
        showMessage('success', 'Пароль успешно изменён!');
        message.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        showMessage('error', 'Не удалось сохранить пароль. Попробуйте ещё раз.');
        saveButton.disabled = false;
        saveButton.textContent = 'Сохранить пароль';
      }
    });

    init();
  </script>
</body>
</html>
