<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440, initial-scale=1.0" />
<title>Helpera — Мои задачи НКО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/pages/ngo-dashboard.css">
<link rel="stylesheet" href="./css/base.css">
<style>
  #tasksList { display: flex; flex-direction: column; gap: 0; }
  .task-card {
    border: 1px solid #E5E7EB;
    border-radius: 24px;
    padding: 18px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
    background: #fff;
    cursor: default;
    box-shadow: none;
  }
  .task-card:last-child { margin-bottom: 0; }
  .task-card:hover { box-shadow: 0 4px 16px rgba(15,23,42,.06); }
  .task-title { font-size: 16px; line-height: 19px; font-weight: 700; margin: 0 0 10px; }
  .task-title a { color: inherit; text-decoration: none; }
  .task-title a:hover { text-decoration: underline; }
  .task-meta { margin: 0 0 12px; font-size: 14px; line-height: 17px; color: #6B7280; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .task-chip { display: inline-flex; align-items: center; min-height: 30px; padding: 7px 16px; border-radius: 999px; border: 1px solid #D1D5DB; background: #fff; color: #4B5563; font-size: 12px; line-height: 15px; font-weight: 700; }
  .task-chip.blue { background: #E3F2FD; border-color: transparent; color: #1E40AF; }
  .task-chip.green { background: #DCFCE7; border-color: transparent; color: #166534; }
  .task-actions { min-width: 114px; text-align: right; padding-top: 2px; flex-shrink: 0; }
  .task-link { display: block; margin-bottom: 10px; font-size: 16px; line-height: 19px; font-weight: 700; text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
  .task-link:last-child { margin-bottom: 0; }
  .task-link.blue { color: #2563EB; }
  .task-link.green { color: #2E7D32; }
  .task-link.red { color: #DC2626; }
</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="index.html" class="brand"><span class="brand-icon"></span></a>
      <nav class="nav">
        <a href="ngo-lk.html" id="navProfile">Профиль</a>
        <a href="ngo-tasks.html" id="navTasks">Мои задачи</a>
        <a href="ngo-applications.html" id="navApplications">Отклики</a>
        <a href="ngo-dashboard.html" id="navDashboard">Аналитика</a>
        <div class="avatar" id="avatarMini">Н</div>
      </nav>
    </header>

    <div class="container">
      <section class="hero panel">
        <div>
          <div class="pill">Мои задачи</div>
          <h1>Задачи вашей организации</h1>
          <p>Управляйте задачами для волонтёров — публикуйте, редактируйте и отслеживайте отклики.</p>
        </div>
        <button class="btn btn-primary" id="createTaskBtn" type="button">Создать новую задачу</button>
      </section>

      <section class="panel content" style="margin-top:30px;">
        <h2>Опубликованные задачи</h2>
        <p class="subtitle">Список опубликованных задач, которые видят волонтёры.</p>
        <p class="subtitle" id="tasksSubtitle">Загружаем задачи...</p>
        <div id="tasksList"></div>
      </section>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js"></script>
<script src="./js/app-db.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('profileId') || localStorage.getItem(helperaDb.localKeys.activeNgoProfileId);
  const withProfileId = (path) => profileId ? `${path}${path.includes('?') ? '&' : '?'}profileId=${encodeURIComponent(profileId)}` : path;
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  })[char]);
  let currentApplications = [];

  function pluralRu(n, one, few, many) {
    const mod100 = Math.abs(n) % 100;
    const mod10 = Math.abs(n) % 10;
    if (mod100 >= 11 && mod100 <= 19) return `${n} ${many}`;
    if (mod10 === 1) return `${n} ${one}`;
    if (mod10 >= 2 && mod10 <= 4) return `${n} ${few}`;
    return `${n} ${many}`;
  }

  const taskStatusLabels = {
    published: 'Опубликовано',
    active: 'Активна',
    draft: 'Черновик',
    closed: 'Закрыта',
    done: 'Завершена',
    archived: 'Архив'
  };

  async function initNgoTasks() {
    document.getElementById('navProfile').href = withProfileId('ngo-lk.html');
    document.getElementById('navTasks').href = withProfileId('ngo-tasks.html');
    document.getElementById('navApplications').href = withProfileId('ngo-applications.html');
    document.getElementById('navDashboard').href = withProfileId('ngo-dashboard.html');
    document.getElementById('createTaskBtn').addEventListener('click', () => window.location.href = withProfileId('new-task.html'));

    if (!profileId) {
      document.getElementById('tasksSubtitle').textContent = 'Профиль НКО не выбран.';
      document.getElementById('tasksList').innerHTML = '<p class="subtitle">Откройте страницу из личного кабинета НКО.</p>';
      return;
    }

    const [profile, tasks, applications] = await Promise.all([
      helperaDb.getNgoProfile(profileId),
      helperaDb.listTasks(),
      helperaDb.listApplications({ ngoProfileId: profileId, includeDrafts: false })
    ]);
    currentApplications = applications;
    const NGO_TASK_LIMIT = 10;
    const ownTasks = tasks.filter((task) => task.ngo_profile_id === profileId);
    const atLimit = ownTasks.length >= NGO_TASK_LIMIT;
    document.getElementById('avatarMini').textContent = (profile?.account?.orgName || profile?.about?.shortName || 'Н').slice(0, 1).toUpperCase();
    document.getElementById('tasksSubtitle').textContent = `${ownTasks.length} из ${NGO_TASK_LIMIT} активных задач • ${applications.length} откликов`;
    const createBtn = document.getElementById('createTaskBtn');
    if (atLimit) {
      createBtn.disabled = true;
      createBtn.title = `Достигнут лимит: не более ${NGO_TASK_LIMIT} активных задач. Закройте неактуальные, чтобы создать новую.`;
    }
    document.getElementById('tasksList').innerHTML = ownTasks.length ? ownTasks.map((task) => {
      const count = applications.filter((item) => item.task_id === task.id).length;
      const statusLabel = taskStatusLabels[task.status] || taskStatusLabels.published;
      const applicationsLabel = pluralRu(count, 'отклик', 'отклика', 'откликов');
      const skills = (task.skills || '').split(',').map((s) => s.trim()).filter(Boolean).slice(0, 3);
      const payload = task.payload || {};
      const dateStr = (() => {
        const start = task.date_start || payload.dateStart;
        const end = task.date_end || payload.dateEnd;
        if (start && end && start !== end) return `${start} — ${end}`;
        if (end) return `до ${end}`;
        if (start) return `с ${start}`;
        return '';
      })();
      return `
        <article class="task-card" data-task-id="${escapeHtml(task.id)}">
          <div>
            <h3 class="task-title"><a href="${withProfileId(`ngo-task-details.html?taskId=${encodeURIComponent(task.id)}`)}">${escapeHtml(task.title || 'Задача без названия')}</a></h3>
            <p class="task-meta">${escapeHtml(task.format || payload.format || 'Формат не указан')}${dateStr ? ` • ${escapeHtml(dateStr)}` : ''}</p>
            <div class="chip-row">
              <span class="task-chip blue">${escapeHtml(applicationsLabel)}</span>
              <span class="task-chip green">${escapeHtml(statusLabel)}</span>
              ${skills.map((s) => `<span class="task-chip">${escapeHtml(s)}</span>`).join('')}
            </div>
          </div>
          <div class="task-actions">
            <a href="${withProfileId(`ngo-task-details.html?taskId=${encodeURIComponent(task.id)}`)}" class="task-link blue task-details-btn">Подробнее</a>
            <a href="${withProfileId(`ngo-task-edit.html?taskId=${encodeURIComponent(task.id)}`)}" class="task-link green task-edit-btn">Редактировать</a>
            <button class="task-link red task-delete-btn" type="button">Удалить</button>
          </div>
        </article>
      `;
    }).join('') : '<p class="subtitle">У этой НКО пока нет опубликованных задач.</p>';
  }

  document.getElementById('tasksList').addEventListener('click', async (event) => {
    const card = event.target.closest('.task-card[data-task-id]');
    if (!card) return;
    const taskId = card.dataset.taskId;
    if (event.target.classList.contains('task-delete-btn')) {
      const title = card.querySelector('.task-title')?.textContent?.trim() || 'эту задачу';
      const confirmed = window.confirm(`Удалить задачу «${title}»? Она исчезнет из списка опубликованных задач для волонтёров.`);
      if (!confirmed) return;
      event.target.disabled = true;
      event.target.textContent = 'Удаляем...';
      try {
        await helperaDb.deleteTask(taskId);
        await helperaDb.logEvent({
          eventType: 'task_deleted',
          actorRole: 'ngo',
          actorProfileId: profileId,
          taskId,
          payload: { source: 'ngo-tasks.html' }
        });
        card.remove();
        const remaining = document.querySelectorAll('#tasksList .task-card').length;
        document.getElementById('tasksSubtitle').textContent = `${remaining} ${remaining === 1 ? 'задача' : remaining < 5 ? 'задачи' : 'задач'} • ${currentApplications.length} откликов`;
        if (!remaining) {
          document.getElementById('tasksList').innerHTML = '<p class="subtitle">У этой НКО пока нет опубликованных задач.</p>';
        }
      } catch (error) {
        console.error(error);
        event.target.disabled = false;
        event.target.textContent = 'Удалить';
        alert(`Не удалось удалить задачу. Попробуйте ещё раз.`);
      }
    }
  });

  initNgoTasks().catch((error) => {
    console.error(error);
    document.getElementById('tasksSubtitle').textContent = 'Не удалось загрузить задачи.';
  });
</script>
</body>
</html>
